name: Deploy Pages

# Publication happens here, in the repository -- not in a platform setting
# (standards/DEPLOYMENT.md).
#
# NOTE ON THE SOURCE BRANCH. The published site lives on gh-pages, not on main:
# main currently holds only a Page under construction placeholder, while
# gh-pages holds the real portfolio. Publishing main would replace the live site
# with the placeholder, so this workflow deliberately checks out gh-pages.
#
# That split is itself a defect worth fixing separately -- the default branch
# should hold what is published -- but resolving it is a content change and is
# out of scope for moving publication into a workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
