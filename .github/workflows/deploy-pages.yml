name: Deploy Pages

# Publication happens here, in the repository -- not in a platform setting
# (standards/DEPLOYMENT.md).
#
# NOTE ON THE SOURCE BRANCH. The published site lives on gh-pages, not on main:
# main currently holds only a Page under construction placeholder, while
# gh-pages holds the real portfolio. Publishing main would replace the live site
# with the placeholder, so this workflow deliberately checks out gh-pages.
#
# NOTE ON THE TRIGGERS. Push events read the workflow file from the PUSHED
# branch's commit, not from the default branch. The 2026-10-09 snapshot removal
# sat undeployed for 18h because the workflow existed only on main and
# triggered only on main pushes, while the content changed on gh-pages.
# This copy triggers on both publishing-relevant branches. Each push fires the
# copy GitHub resolves for that pushed branch: gh-pages pushes fire the copy
# that now lives on gh-pages itself; main pushes fire this one.
# Keep this file in sync with the gh-pages copy -- identical except for the
# trigger list, which must always include the branch the copy lives on.

on:
  push:
    branches: [main, gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
